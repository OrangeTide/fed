name: Build

on:
  push:
    branches: [master]
    tags: ['rel/*']
  pull_request:

jobs:
  linux-x86_64:
    name: Linux x86-64 (musl static)
    runs-on: ubuntu-latest
    container: alpine:3.21
    steps:
      - name: Install build dependencies
        run: apk add --no-cache build-base ncurses-dev ncurses-static git
      - uses: actions/checkout@v4
      - name: Build
        run: sh ci/build-linux-musl.sh
      - name: Package
        run: sh ci/package-linux-x86_64.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fed-linux-x86_64
          path: dist/fed-linux-x86_64.tar.gz

  linux-arm64:
    name: Linux ARM64 (musl static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build and package in Alpine ARM64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/work" -w /work \
            alpine:3.21 sh -c "
              apk add --no-cache build-base ncurses-dev ncurses-static &&
              sh ci/build-linux-arm64.sh &&
              sh ci/package-linux-arm64.sh
            "
      - uses: actions/upload-artifact@v4
        with:
          name: fed-linux-arm64
          path: dist/fed-linux-arm64.tar.gz

  linux-arm32:
    name: Linux ARM32 (musl static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Build and package in Alpine ARM32 container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "${{ github.workspace }}:/work" -w /work \
            alpine:3.21 sh -c "
              apk add --no-cache build-base ncurses-dev ncurses-static &&
              sh ci/build-linux-arm32.sh &&
              sh ci/package-linux-arm32.sh
            "
      - uses: actions/upload-artifact@v4
        with:
          name: fed-linux-arm32
          path: dist/fed-linux-arm32.tar.gz

  windows-x86_64:
    name: Windows x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build
        run: ci/build-win64.sh
      - name: Package
        run: ci/package-win64.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fed-windows-x86_64
          path: dist/fed-win64.zip

  windows-x86:
    name: Windows x86 (32-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686
      - name: Build
        run: ci/build-win32.sh
      - name: Package
        run: ci/package-win32.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fed-windows-x86
          path: dist/fed-win32.zip

  msdos32-djgpp:
    name: MS-DOS 32-bit (DJGPP)
    runs-on: ubuntu-latest
    env:
      # https://github.com/andrewwutw/build-djgpp/releases
      DJGPP_ARCHIVE: djgpp-linux64-gcc1220.tar.bz2
      DJGPP_URL: https://github.com/andrewwutw/build-djgpp/releases/download/v3.4/djgpp-linux64-gcc1220.tar.bz2
    steps:
      - uses: actions/checkout@v4
      - name: Download DJGPP cross-compiler
        run: |
          curl -fsSL "$DJGPP_URL" | sudo tar xjf - -C /usr/local
          echo "/usr/local/djgpp/bin" >> "$GITHUB_PATH"
      - name: Build
        run: ci/build-dos32-djgpp.sh
      - name: Package
        run: ci/package-dos32-djgpp.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fed-dos32-djgpp
          path: dist/fed-dos32-djgpp.zip

  msdos32-watcom:
    name: MS-DOS 32-bit (Open Watcom)
    runs-on: ubuntu-latest
    env:
      WATCOM_URL: https://github.com/open-watcom/open-watcom-v2/releases/download/2026-04-01-Build/ow-snapshot.tar.xz
    steps:
      - uses: actions/checkout@v4
      - name: Download Open Watcom
        run: |
          sudo mkdir -p /usr/local/watcom
          curl -fsSL "$WATCOM_URL" | sudo tar xJf - -C /usr/local/watcom
      - name: Build
        env:
          WATCOM: /usr/local/watcom
        run: |
          export PATH="$WATCOM/binl64:$WATCOM/binw:$PATH"
          sh ci/build-dos32-watcom.sh
      - name: Package
        run: sh ci/package-dos32-watcom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fed-dos32-watcom
          path: dist/fed-dos32-watcom.zip

  msdos16-watcom:
    name: MS-DOS 16-bit (Open Watcom)
    runs-on: ubuntu-latest
    env:
      WATCOM_URL: https://github.com/open-watcom/open-watcom-v2/releases/download/2026-04-01-Build/ow-snapshot.tar.xz
    steps:
      - uses: actions/checkout@v4
      - name: Download Open Watcom
        run: |
          sudo mkdir -p /usr/local/watcom
          curl -fsSL "$WATCOM_URL" | sudo tar xJf - -C /usr/local/watcom
      - name: Build
        env:
          WATCOM: /usr/local/watcom
        run: |
          export PATH="$WATCOM/binl64:$WATCOM/binw:$PATH"
          sh ci/build-dos16-watcom.sh
      - name: Package
        run: sh ci/package-dos16-watcom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fed-dos16-watcom
          path: dist/fed-dos16-watcom.zip

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/rel/')
    needs: [linux-x86_64, linux-arm64, linux-arm32, windows-x86_64, windows-x86, msdos32-djgpp, msdos32-watcom, msdos16-watcom]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Scan artifacts with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          pip install vt-py
          python3 -c "
          import vt, sys, os, time, pathlib

          client = vt.Client(os.environ['VT_API_KEY'])
          failed = []

          for path in sorted(pathlib.Path('artifacts').rglob('*')):
              if not path.is_file():
                  continue
              print(f'Scanning {path} ...')
              with open(path, 'rb') as f:
                  analysis = client.scan_file(f)
              # poll until analysis completes
              while True:
                  analysis = client.get_object('/analyses/{}', analysis.id)
                  if analysis.status == 'completed':
                      break
                  time.sleep(15)
              stats = analysis.stats
              print(f'  Results: {stats}')
              if stats.get('malicious', 0) > 0 or stats.get('suspicious', 0) > 0:
                  failed.append(str(path))

          client.close()
          if failed:
              print(f'::error::AV detections found in: {\", \".join(failed)}')
              sys.exit(1)
          print('All artifacts clean.')
          "
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#rel/}"
          gh release create "$TAG" \
            --title "FED $VERSION" \
            --generate-notes \
            artifacts/fed-linux-x86_64/* \
            artifacts/fed-linux-arm64/* \
            artifacts/fed-linux-arm32/* \
            artifacts/fed-windows-x86_64/* \
            artifacts/fed-windows-x86/* \
            artifacts/fed-dos32-djgpp/* \
            artifacts/fed-dos32-watcom/* \
            artifacts/fed-dos16-watcom/*
